<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
      .panel-title { font: 700 25px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
      .label { font: 600 19px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
      .small { font: 500 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #34495e; }
      .tiny { font: 500 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #f8fafc; stroke: #aeb8c2; stroke-width: 2; rx: 8; }
      .compute { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; rx: 6; }
      .buffer { fill: #fef3c7; stroke: #d97706; stroke-width: 3; rx: 6; }
      .hbm { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; rx: 6; }
      .fast { fill: #dcfce7; stroke: #15803d; stroke-width: 3; rx: 6; }
      .capacity { fill: #f1f5f9; stroke: #64748b; stroke-width: 3; rx: 6; }
      .control { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3; rx: 6; }
      .band { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 4; }
      .arrow-wide { stroke: #0369a1; stroke-width: 8; fill: none; marker-end: url(#arrow-blue); }
      .arrow-fast { stroke: #15803d; stroke-width: 9; fill: none; marker-end: url(#arrow-green); }
      .arrow-slow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow-gray); }
      .arrow-copy { stroke: #7c3aed; stroke-width: 4; fill: none; stroke-dasharray: 10 7; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 Z" fill="#0369a1"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">全容量低带宽端侧基线与小容量高速、大容量低速分层存储加速器</text>

  <rect x="35" y="85" width="735" height="730" class="panel"/>
  <rect x="830" y="85" width="735" height="730" class="panel"/>

  <text x="402" y="128" text-anchor="middle" class="panel-title">端侧基线：完整模型共享容量型内存</text>
  <text x="1198" y="128" text-anchor="middle" class="panel-title">本方案：小容量高带宽 + 大容量低成本</text>

  <!-- All-capacity-memory edge baseline -->
  <rect x="238" y="170" width="330" height="190" class="compute"/>
  <text x="403" y="207" text-anchor="middle" class="label">GPU / NPU Compute Die</text>
  <rect x="278" y="235" width="250" height="62" class="buffer"/>
  <text x="403" y="273" text-anchor="middle" class="label">L2 / 片上缓存 / 寄存器</text>
  <text x="403" y="330" text-anchor="middle" class="small">全部计算核心执行 attention 与 MoE</text>

  <rect x="78" y="455" width="140" height="150" class="hbm"/>
  <rect x="245" y="455" width="140" height="150" class="hbm"/>
  <rect x="412" y="455" width="140" height="150" class="hbm"/>
  <rect x="579" y="455" width="140" height="150" class="hbm"/>
  <text x="148" y="500" text-anchor="middle" class="label">LPDDR Ch. 0</text>
  <text x="315" y="500" text-anchor="middle" class="label">LPDDR Ch. 1</text>
  <text x="482" y="500" text-anchor="middle" class="label">LPDDR Ch. 2</text>
  <text x="649" y="500" text-anchor="middle" class="label">LPDDR Ch. 3</text>
  <text x="148" y="535" text-anchor="middle" class="small">Working + Idle</text>
  <text x="315" y="535" text-anchor="middle" class="small">Working + Idle</text>
  <text x="482" y="535" text-anchor="middle" class="small">Working + Idle</text>
  <text x="649" y="535" text-anchor="middle" class="small">Working + Idle</text>
  <text x="148" y="573" text-anchor="middle" class="tiny">统一条带化</text>
  <text x="315" y="573" text-anchor="middle" class="tiny">统一条带化</text>
  <text x="482" y="573" text-anchor="middle" class="tiny">统一条带化</text>
  <text x="649" y="573" text-anchor="middle" class="tiny">统一条带化</text>

  <path d="M148 455 C148 405 290 407 315 360" class="arrow-slow"/>
  <path d="M315 455 C315 410 360 405 375 360" class="arrow-slow"/>
  <path d="M482 455 C482 410 445 405 430 360" class="arrow-slow"/>
  <path d="M649 455 C649 405 515 407 490 360" class="arrow-slow"/>

  <rect x="115" y="655" width="575" height="88" class="band"/>
  <text x="402" y="688" text-anchor="middle" class="label">完整模型共享同一容量型带宽</text>
  <text x="402" y="717" text-anchor="middle" class="small">模型装得下，但 batch-1 decode 受权重供数带宽限制</text>

  <!-- Tiered proposal -->
  <rect x="1030" y="170" width="335" height="190" class="compute"/>
  <text x="1198" y="207" text-anchor="middle" class="label">Edge MoE Compute Die</text>
  <rect x="1070" y="235" width="255" height="62" class="buffer"/>
  <text x="1198" y="273" text-anchor="middle" class="label">L2 / 片上缓存 / 寄存器</text>
  <text x="1198" y="330" text-anchor="middle" class="small">计算结构保持统一，存储带宽按层级配置</text>

  <rect x="870" y="430" width="330" height="220" class="fast"/>
  <text x="1035" y="470" text-anchor="middle" class="label">高带宽层 Fast Tier</text>
  <text x="1035" y="505" text-anchor="middle" class="small">约 20% 逻辑容量</text>
  <text x="1035" y="538" text-anchor="middle" class="small">Attention / LM Head / KV</text>
  <text x="1035" y="568" text-anchor="middle" class="small">近期 Experts / Hidden State</text>
  <rect x="905" y="592" width="260" height="34" class="band"/>
  <rect x="905" y="592" width="52" height="34" fill="#22c55e"/>
  <text x="1035" y="616" text-anchor="middle" class="tiny">小容量，保留高聚合带宽</text>

  <rect x="1250" y="430" width="275" height="220" class="capacity"/>
  <text x="1388" y="470" text-anchor="middle" class="label">容量层 Capacity Tier</text>
  <text x="1388" y="505" text-anchor="middle" class="small">约 80% 逻辑容量</text>
  <text x="1388" y="538" text-anchor="middle" class="small">Inactive Experts</text>
  <text x="1388" y="568" text-anchor="middle" class="small">单位容量成本优先</text>
  <rect x="1285" y="592" width="205" height="34" class="band"/>
  <rect x="1285" y="592" width="164" height="34" fill="#94a3b8"/>
  <text x="1388" y="616" text-anchor="middle" class="tiny">大容量，较低接口带宽</text>

  <path d="M1035 430 C1035 390 1110 390 1140 360" class="arrow-fast"/>
  <path d="M1388 430 C1388 390 1285 390 1255 360" class="arrow-slow"/>
  <path d="M1200 545 C1220 545 1227 545 1250 545" class="arrow-copy"/>
  <path d="M1250 520 C1225 520 1220 520 1200 520" class="arrow-copy"/>
  <text x="1225" y="500" text-anchor="middle" class="tiny" fill="#6d28d9">对象迁移</text>

  <rect x="935" y="680" width="525" height="82" class="control"/>
  <text x="1198" y="713" text-anchor="middle" class="label">分层内存控制器与对象映射表</text>
  <text x="1198" y="741" text-anchor="middle" class="small">高速读取 / 容量层读取 / Expert Block 迁移</text>

  <text x="1198" y="795" text-anchor="middle" class="small">物理实现：HBM + DDR/LPDDR · 高速 DRAM + 容量 DRAM · HBM + Flash</text>

  <!-- Legend -->
  <line x1="90" y1="858" x2="145" y2="858" class="arrow-slow"/>
  <text x="160" y="864" class="tiny">全容量内存共享带宽</text>
  <line x1="390" y1="858" x2="445" y2="858" class="arrow-fast"/>
  <text x="460" y="864" class="tiny">高速层主要数据流</text>
  <line x1="735" y1="858" x2="790" y2="858" class="arrow-slow"/>
  <text x="805" y="864" class="tiny">容量层低频数据流</text>
  <line x1="1080" y1="858" x2="1135" y2="858" class="arrow-copy"/>
  <text x="1150" y="864" class="tiny">层间复制 / 迁移</text>
</svg>
