   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #17324d" x="632.16" y="108.781875" transform="rotate(-0 632.16 108.781875)">节点 B：专家 3</text>
