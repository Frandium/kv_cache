   <g id="text_8">
    <text style="font-size: 15px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #168779" x="29.52" y="284.4" transform="rotate(-0 29.52 284.4)">本方案：需求相近的请求共同复用本地专家</text>
   </g>
   <g id="text_9">
