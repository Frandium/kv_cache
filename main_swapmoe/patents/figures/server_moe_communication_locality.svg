   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #17324d" x="26.73" y="34.92" transform="rotate(-0 26.73 34.92)">把反复的 token 往返，转为可复用的专家复制</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #667789" x="26.73" y="59.868" transform="rotate(-0 26.73 59.868)">优化对象：同层 EP 跨节点通信；P→D 交接建立局部性，硬件在 decode 中持续维护</text>
   </g>
   <g id="text_3">
    <text style="font-size: 15px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #c57828" x="29.52" y="98.676" transform="rotate(-0 29.52 98.676)">常规 MoE：每个生成步重复跨节点分发与返回</text>
   </g>
   <g id="text_4">
